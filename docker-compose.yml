services:
  web:
    build: .
    container_name: website-cms-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      UPLOAD_DIR: public/uploads
      UPLOAD_PUBLIC_BASE: /uploads
    volumes:
      - /opt/storage/uploads:/app/public/uploads
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: website-cms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
